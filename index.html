<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bachelor Golf - Leaderboard</title>
  <style>
    :root {
      --bg-dark: #04120c;
      --card-bg: #0b2219;
      --gold: #e2c044;
      --gold-dim: rgba(226, 192, 68, 0.2);
      --text-light: #f1f1f1;
    }
    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
    }
    nav {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }
    nav a {
      color: var(--gold);
      text-decoration: none;
      padding: 8px 16px;
      border: 1px solid var(--gold-dim);
      border-radius: 6px;
      font-weight: bold;
      background: var(--card-bg);
    }
    h1, h2 {
      color: var(--gold);
    }
    .leaderboard-card {
      background: var(--card-bg);
      border: 1px solid var(--gold-dim);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    th {
      color: var(--gold);
    }
  </style>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Firebase Config (Replace with your Firebase details)
    const firebaseConfig = {
      databaseURL: "YOUR_FIREBASE_DATABASE_URL"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const scoresRef = ref(db, 'scores');
    onValue(scoresRef, (snapshot) => {
      const data = snapshot.val() || {};
      renderLeaderboard(data);
    });

    function renderLeaderboard(data) {
      const container = document.getElementById('leaderboard-body');
      if(!container) return;
      container.innerHTML = '';

      const teamTotals = {};
      Object.keys(data).forEach(roundKey => {
        const round = data[roundKey];
        if (round && round.teams) {
          Object.keys(round.teams).forEach(teamName => {
            if (!teamTotals[teamName]) teamTotals[teamName] = 0;
            const shots = round.teams[teamName].shots || {};
            Object.values(shots).forEach(val => {
              teamTotals[teamName] += Number(val || 0);
            });
          });
        }
      });

      const sorted = Object.keys(teamTotals).map(k => ({ name: k, score: teamTotals[k] }))
        .sort((a, b) => a.score - b.score);

      sorted.forEach((t, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>#${i + 1}</td><td>${t.name}</td><td>${t.score}</td>`;
        container.appendChild(tr);
      });
    }
  </script>
</head>
<body>
  <nav>
    <a href="index.html">Leaderboard</a>
    <a href="scorecard.html">Scorecard & Entry</a>
    <a href="setup.html">Setup</a>
  </nav>

  <h1>Tournament Leaderboard</h1>
  <div class="leaderboard-card">
    <table>
      <thead>
        <tr>
          <th>Rank</th>
          <th>Team</th>
          <th>Total Shots</th>
        </tr>
      </thead>
      <tbody id="leaderboard-body">
        <tr><td colspan="3">Loading standings...</td></tr>
      </tbody>
    </table>
  </div>
</body>
</html>
