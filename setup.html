<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bachelor Golf - Setup</title>
  <style>
    :root {
      --bg-dark: #04120c;
      --card-bg: #0b2219;
      --gold: #e2c044;
      --gold-dim: rgba(226, 192, 68, 0.2);
      --text-light: #f1f1f1;
    }
    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
    }
    nav {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }
    nav a {
      color: var(--gold);
      text-decoration: none;
      padding: 8px 16px;
      border: 1px solid var(--gold-dim);
      border-radius: 6px;
      font-weight: bold;
      background: var(--card-bg);
    }
    .setup-card {
      background: var(--card-bg);
      border: 1px solid var(--gold-dim);
      border-radius: 8px;
      padding: 16px;
    }
    input, button {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--gold-dim);
      background: #061610;
      color: #fff;
      font-size: 1rem;
      box-sizing: border-box;
      width: 100%;
      margin-top: 8px;
    }
    button {
      background: var(--gold);
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
  <script>
    function checkPass() {
      const pass = document.getElementById('pass-input').value;
      if(pass === 'cflynn') {
        document.getElementById('protected-content').style.display = 'block';
        document.getElementById('login-box').style.display = 'none';
      } else {
        alert('Incorrect password');
      }
    }
  </script>
</head>
<body>
  <nav>
    <a href="index.html">Leaderboard</a>
    <a href="scorecard.html">Scorecard & Entry</a>
    <a href="setup.html">Setup</a>
  </nav>

  <h1>Tournament Setup</h1>

  <div id="login-box" class="setup-card">
    <label>Enter Password to Manage Tournament Setup</label>
    <input type="password" id="pass-input">
    <button onclick="checkPass()">Login</button>
  </div>

  <div id="protected-content" class="setup-card" style="display:none;">
    <h2>Admin Panel</h2>
    <p>Password verified. You can configure rounds, reset database nodes, and manage groups here.</p>
  </div>
</body>
</html>
