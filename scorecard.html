<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bachelor Golf Tournament - Scorecard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1>Scorecard View</h1>
  <div id="scorecard-grid"></div>

  <script src="scorecard.js"></script>
  <script>
    // Example loading script connecting courses.json with render function
    fetch('courses.json')
      .then(res => res.json())
      .then(courses => {
        const activeCourse = courses[0]; // Loads Olde Kinderhook by default
        
        // Demo team data structure
        const demoTeams = [
          { name: "Team 1", scores: { 1: 4, 2: 4, 3: 5, 4: 3 } },
          { name: "Team 2", scores: { 1: 5, 2: 3, 3: 4, 4: 4 } }
        ];

        renderScorecardGrid(activeCourse, demoTeams);
      });
  </script>
</body>
</html>
